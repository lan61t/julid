name: rebuild-julid

on:
  workflow_dispatch:               # the "Run workflow" button (GitHub site or app, works from a phone)
  schedule:
    - cron: "*/15 * * * *"         # every 15 minutes: fresh injuries, schedule and box scores (GitHub may delay a run a few minutes)
  push:
    paths:
      - "yahoo.json"          # a new Yahoo scrape was committed (bookmark flow or the PC refresh)
      - "julid_bundle.zip"         # new engine code

permissions:
  contents: write

concurrency:
  group: julid-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack engine and data
        run: unzip -q -o julid_bundle.zip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Apply the latest Yahoo scrape (rosters, free agents, live totals)
        env:
          JULID_RAW: data/julid
          JULID_NO_HISTORY: "1"
        run: |
          mkdir -p data/julid
          if [ -f yahoo.json ]; then python scripts/refresh_julid.py --in yahoo.json --no-build --if-new; fi

      - name: Build the page
        env:
          JULID_RAW: data/julid
          JULID_SITE: site
        run: python scripts/build_julid_site.py

      - name: Publish
        run: |
          cp site/index.html site/box.json .
          cp site/manifest.webmanifest site/icon.svg site/icon-180.png site/icon-192.png site/icon-512.png .
          git config user.name "julid-bot"
          git config user.email "julid-bot@users.noreply.github.com"
          mkdir -p data/live
          git add index.html box.json manifest.webmanifest icon.svg icon-180.png icon-192.png icon-512.png data/julid data/live
          git diff --cached --quiet || { git commit -q -m "rebuild $(date -u +%Y-%m-%dT%H:%MZ)"; git push -q; }
