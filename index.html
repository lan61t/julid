.slot{display:inline-block;min-width:34px;font-weight:700;color:var(--acc)}

.me td:first-child{font-weight:700}

.cbar i{position:absolute;left:0;top:0;bottom:0;background:var(--barfill)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}

.crow.h{font-size:12px;color:var(--mute);font-weight:600;padding-top:0}
.crow:last-child{border-bottom:0}.crow .num{text-align:right}
.crow .c-now{color:var(--mute)}

 flip), favourites won 68% of the time; category chances scored 0.185. Matchup recalibration slope 0.93 (1.0 = perfectly honest); re-fitting it did not improve held-out seasons, so the page shows the raw chance. Caveat: opponents were drafted by the same model, real managers may differ."};
const TABS = [["m","Matchup"],["l","Lineup"],["s","Moves"],["g","League"],["y","Season"],["i","Info"]];
let tab = "m", dayIdx = null;
try { tab = localStorage.getItem("jd_tab") || "m"; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => Math.round(v * 100) + "%";
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const tagc = t => "t-" + t.replace(" ", "-");
const isPct = k => k === "fg_pct" || k === "ft_pct";
const val = (c, v) => isPct(c.key) ? (v * 100).toFixed(1) + "%" : f1(v);

function nav() {
  $("#nav").innerHTML = TABS.map(([k, n]) => `<button class="${k === tab ? "on" : ""}" data-k="${k}">${n}</button>`).join("");
  $("#nav").onclick = e => { const k = e.target.dataset.k; if (k) { tab = k; try { localStorage.setItem("jd_tab", k); } catch (x) {} draw(); window.scrollTo(0, 0); } };
}

function matchup(S) {
  const win = S.p_win;
  let h = `<div class="card"><div class="row"><div><div class="mute small">Week ${S.week} · ${esc(S.start)} to ${esc(S.end)}</div><div style="font-weight:600">${esc(S.me)} vs ${esc(S.opp)}</div></div>
    <div style="text-align:right"><div class="big ${win >= .5 ? "good" : "bad"}">${pct(win)}</div><div class="mute small">chance to win</div></div></div>
    <div class="bar" style="margin:10px 0 6px"><i style="width:${S.exp_cats / 9 * 100}%"></i></div>
    <div class="small mute">Expect about <b>${S.exp_cats.toFixed(1)}</b> of 9 categories (need 5). Calls use the best lineup every day and a category plan tuned against this opponent.</div></div>`;
  const mar = c => { const d = c.me - c.opp; const u = isPct(c.key) ? (d * 100).toFixed(1) + " pts" : f1(d); return `Margin ${d >= 0 ? "+" : ""}${u}${c.key === "to" ? " (lower wins)" : ""}`; };
  h += `<div class="card"><h2>Categories</h2><div class="crow h"><div>Cat</div><div class="num">Final: you v opp</div><div>Win chance</div><div>Margin</div><div>Call</div></div>` +
    S.cats.map(c => { const lead = c.key === "to" ? c.me < c.opp : c.me > c.opp;
      return `<div class="crow"><div class="c-lab"><b>${esc(c.label)}</b>${c.weight < 0.99 ? `<span class="muted small"> ${c.weight === 0 ? "punt" : "light"}</span>` : ""}</div>
      <div class="c-proj num"><span class="${lead ? "pos" : "neg"}">${val(c, c.me)}</span> <span class="mute">v ${val(c, c.opp)}</span></div>
      <div class="c-bar"><span class="cbar"><i style="width:${pct(c.p)}"></i></span></div>
      <div class="c-now">${mar(c)}</div>
      <div class="c-call"><b>${pct(c.p)}</b> <span class="tag ${tagc(c.tag)}">${esc(c.tag)}</span></div></div>`; }).join("") + `</div>`;
  const tight = S.cats.filter(c => c.p > .35 && c.p < .65).map(c => c.label);
  const lose = S.cats.filter(c => c.p <= .35).map(c => c.label);
  h += `<div class="card"><h2>Read-out</h2><div class="small">${tight.length ? `<b>Swing categories:</b> ${tight.join(", ")}. ` : ""}${lose.length ? `<b>Probably lost:</b> ${lose.join(", ")}.` : "No category looks lost."}</div></div>`;
  h += `<div class="card"><h2>Their roster this week</h2>` + S.opp_roster.map(p => `<span class="pill">${esc(p.name)} · ${p.games}g${p.inj !== "ACTIVE" ? ` <span class="inj">${p.inj === "OUT" ? "OUT" : "Q"}</span>` : ""}</span>`).join("") + `</div>`;
  return h;
}

function lineup(S) {
  if (dayIdx === null) dayIdx = Math.max(0, S.lineup.findIndex(d => !d.past));
  const d = S.lineup[dayIdx];
  let h = `<div class="dayrow">` + S.lineup.map((x, i) => `<button class="${i === dayIdx ? "on" : ""}" data-d="${i}">${esc(x.day)}</button>`).join("") + `</div>`;
  h += `<div class="card"><h2>${esc(d.day)} — ${d.starters.length} starters</h2>` +
    (d.starters.length ? d.starters.map(s => `<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)"><span><span class="slot">${esc(s.slot)}</span>${esc(s.name)} <span class="mute small">${esc(s.team)}</span></span><span class="mute small">${pct(s.p)} plays</span></div>`).join("") : `<div class="mute">No one on your roster has a game.</div>`) + `</div>`;
  if (d.bench.length) h += `<div class="card"><h2>Has a game but sits</h2>${d.bench.map(n => `<span class="pill">${esc(n)}</span>`).join("")}<div class="small mute" style="margin-top:6px">Every slot is already filled by a better fit, or his line would hurt more than help (turnovers, FG%).</div></div>`;
  if (d.off.length) h += `<div class="card"><h2>No game</h2>${d.off.map(n => `<span class="pill">${esc(n)}</span>`).join("")}</div>`;
  h += `<div class="card"><h2>Your roster</h2><div class="scroll"><table><tr><th>Player</th><th>G</th><th>Start</th><th>PTS</th><th>REB</th><th>AST</th><th>3PM</th><th>TO</th></tr>` +
    S.roster.map(p => `<tr><td>${esc(p.name)}${p.inj !== "ACTIVE" ? ` <span class="inj">${p.inj === "OUT" ? "OUT" : "Q"}</span>` : ""} <span class="mute small">${esc(p.pos)}</span></td><td>${p.games}</td><td>${p.starts}</td><td>${p.line.pts}</td><td>${p.line.reb}</td><td>${p.line.ast}</td><td>${p.line.tpm}</td><td>${p.line.to}</td></tr>`).join("") + `</table></div><div class="small mute">Per-game projections. G = games this week, Start = planned starts.</div></div>`;
  return h;
}

function moves(S) {
  const b = S.budget;
  let h = `<div class="card"><h2>Add budget</h2><div class="small">${b.used} used, <b>${b.left} left</b> of 100 for the whole season (no weekly limit). ${b.weeks_left} weeks remain, so a fair pace is about <b>${b.per_week} per week</b>. Spend an add only when it moves the matchup noticeably.</div></div>`;
  const rows = (S.streaming || []);
  h += `<div class="card"><h2>Best add / drop this week</h2>`;
  if (!rows.length) h += `<div class="mute">No useful swap found.</div>`;
  rows.slice(0, 8).forEach(r => {
    h += `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row"><span><b>Add ${esc(r.add)}</b> <span class="mute small">${esc(r.add_team)} · ${r.games}g</span><br>Drop ${esc(r.drop)}</span><span class="${r.d_pwin > 0 ? "good" : "bad"}"><b>${r.d_pwin >= 0 ? "+" : ""}${(r.d_pwin * 100).toFixed(1)}</b> pts</span></div>
      <div class="small mute">${r.helps.length ? "Helps: " + r.helps.slice(0, 3).map(e => e[0]).join(", ") : ""}${r.hurts.length ? " · Hurts: " + r.hurts.slice(0, 3).map(e => e[0]).join(", ") : ""}</div></div>`;
  });
  h += `<div class="note">A swap worth under about +1.5 points of win chance is usually not worth one of your ${b.left} remaining adds.</div></div>`;
  return h;
}

function league(S) {
  let h = `<div class="card"><h2>Power ranking</h2><div class="small mute" style="margin-bottom:6px">Expected categories won against an average opponent this week (all-play, no luck).</div><div class="scroll"><table><tr><th>#</th><th>Team</th><th>Cats</th><th>Win</th></tr>` +
    S.power.map((t, i) => `<tr class="${t.team === S.me ? "me" : ""}"><td>${i + 1}</td><td>${esc(t.team)}</td><td>${t.exp_cats_vs_avg.toFixed(2)}</td><td>${pct(t.p_win_vs_avg)}</td></tr>`).join("") + `</table></div></div>`;
  const keys = Object.keys(S.power[0].cat_p);
  h += `<div class="card"><h2>Category strength (chance to beat an average team)</h2><div class="scroll"><table><tr><th>Team</th>${keys.map(k => `<th>${k}</th>`).join("")}</tr>` +
    S.power.map(t => `<tr class="${t.team === S.me ? "me" : ""}"><td>${esc(t.team.slice(0, 12))}</td>${keys.map(k => `<td>${Math.round(t.cat_p[k] * 100)}</td>`).join("")}</tr>`).join("") + `</table></div></div>`;
  h += `<div class="card"><h2>Rosters</h2>` + Object.values(S.teams).map(t => `<details style="margin:6px 0"><summary><b>${esc(t.name)}</b></summary><div style="padding-top:6px">${t.players.map(n => `<span class="pill">${esc(n)}</span>`).join("")}</div></details>`).join("") + `</div>`;
  return h;
}

function season(S) {
  const o = S.outlook;
  const exp = o.reduce((a, x) => a + x.p_win, 0);
  let h = `<div class="card"><h2>Rest of the regular season</h2><div class="small">Expected wins over the ${o.length} weeks left (weeks ${o[0].week}–19): <b>${exp.toFixed(1)}</b>. Playoffs are weeks 20–22 (8 of 12 teams). Weeks 7 and 17 are two-week matchups.</div></div>`;
  h += `<div class="card"><div class="scroll"><table><tr><th>Wk</th><th>Dates</th><th>Opponent</th><th>Win</th><th>Cats</th></tr>` +
    o.map(x => `<tr><td>${x.week}</td><td>${x.start.slice(5)}</td><td>${esc(x.opp)}</td><td class="${x.partial_schedule ? "warn" : ""}">${pct(x.p_win)}${x.partial_schedule ? "*" : ""}</td><td>${x.exp_cats.toFixed(1)}</td></tr>`).join("") + `</table></div>` +
    (o.some(x => x.partial_schedule) ? `<div class="note">* The NBA has not published every game for this week yet (Cup games come in December), so it is understated.</div>` : "") +
    `<div class="small mute">Future weeks assume today's rosters and injuries; they will move with every trade, add and injury.</div></div>`;
  return h;
}

function info(S) {
  let h = `<div class="card"><h2>League rules used</h2><div class="small">Julid NBA League (Yahoo 17676), 12 teams, head-to-head categories. 9 cats: FG%, FT%, 3PM, PTS, REB, AST, STL, BLK, TO (turnovers: fewer wins). 10 starting slots (PG SG G SF PF F C C Util Util), 3 bench, 2 IL. No games cap, daily lineups. 100 adds for the season, waivers 1 day.</div></div>`;
  h += `<div class="card"><h2>How it works</h2><div class="small">Each player is projected from last season blended with this season's games. Every day the best legal lineup is picked, expected totals and their uncertainty are added up, and each category is a win chance. The matchup chance is the probability of winning at least 5 of 9.</div></div>`;
  h += `<div class="card"><h2>Known limits</h2><div class="small"><ul style="margin:0;padding-left:18px"><li>Rosters, free agents and injury tags are a snapshot (${esc(S.asof)}), not live. Refresh = rebuild and republish.</li><li>The win chance is a model, not a promise: backtested on 4 past seasons (see below), categories treated as independent, opponents assumed to play their best lineup.</li><li>Your own power rank is flattered because the same model helped draft your team.</li><li>Yahoo's API refuses this app for now, so data comes from reading the league pages.</li></ul></div></div>`;
  if (S.backtest) h += `<div class="card"><h2>Backtest (9 categories)</h2><div class="small">${esc(S.backtest)}</div></div>`;
  if (S.warnings && S.warnings.length) h += `<div class="card"><h2>Warnings</h2>${S.warnings.map(w => `<div class="small warn">• ${esc(w)}</div>`).join("")}</div>`;
  h += `<div class="small mute">Built ${esc(S.asof)}</div>`;
  return h;
}

function draw() {
  const S = STATE;
  nav();
  if (!S) { $("#main").innerHTML = `<div class="card">No data embedded.</div>`; return; }
  $("#ttl").textContent = S.me;
  $("#sub").textContent = `Julid NBA League · Week ${S.week} vs ${S.opp} · data ${S.asof}`;
  $("#main").innerHTML = {m: matchup, l: lineup, s: moves, g: league, y: season, i: info}[tab](S);
  document.querySelectorAll(".dayrow button").forEach(b => b.onclick = () => { dayIdx = +b.dataset.d; draw(); });
}
draw();
</script>
