<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5fd9">
<title>Julid Daily</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#141a26;--mute:#5d6678;--line:#e2e6ee;--acc:#2b5fd9;--good:#17803d;--bad:#c62828;--warn:#b26a00;--chip:#eaf0ff;--lock:#d9f2e1;--lean:#ecf8d8;--toss:#fff3cf;--leanopp:#ffe6d1;--concede:#fbdcdc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1217;--card:#181d27;--ink:#e8ecf4;--mute:#97a1b5;--line:#2a3140;--acc:#6f9bff;--good:#59d17f;--bad:#ff7b7b;--warn:#f0b050;--chip:#22304f;--lock:#173a27;--lean:#26391a;--toss:#3b3217;--leanopp:#40281a;--concede:#401e1e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 16px 84px}
header{padding:16px 0 8px}h1{font-size:20px;margin:0}.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 8px}.big{font-size:44px;font-weight:700;line-height:1}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mute{color:var(--mute)}.small{font-size:12px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse}th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}th{color:var(--mute);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.t-lock{background:var(--lock)}.t-lean{background:var(--lean)}.t-toss-up{background:var(--toss)}.t-lean-opp{background:var(--leanopp)}.t-concede{background:var(--concede)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
nav{overflow-x:auto;position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;min-width:58px;min-height:50px;border:0;background:none;color:var(--mute);padding:8px 2px;font:700 11.5px system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}nav button i{font-style:normal;font-size:19px;line-height:1}nav button.on{color:var(--acc)}
.pill{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 7px;margin:2px 4px 2px 0;font-size:12px}
.slot{display:inline-block;min-width:34px;font-weight:700;color:var(--acc)}
.dayrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}.dayrow button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:600 13px system-ui}.dayrow button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.inj{color:var(--warn);font-weight:700;font-size:12px}.scroll{overflow-x:auto}.note{background:var(--toss);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.me td:first-child{font-weight:700}
#rst td.stk,#rst th.stk,#lut td.stk,#lut th.stk{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line)}
.pname{display:inline-block;vertical-align:bottom;max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.rost-full .pname{max-width:none}
th.s{cursor:pointer}.pbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:600 12px system-ui;cursor:pointer}
.pos,.good{color:var(--good)}.neg{color:var(--bad)}.eff{display:inline-block;border-radius:6px;padding:1px 6px;margin-right:3px;font-size:12px}.eff.up{background:var(--lock)}.eff.down{background:var(--concede)}
.srow{padding:8px 0;border-bottom:1px solid var(--line)}.srow .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@page{size:landscape;margin:10mm}
@media print{nav,.noprint,header .sub{display:none !important}body{background:#fff;padding:0}.pname{max-width:none !important}#rst td.stk,#rst th.stk{position:static;box-shadow:none}.card{border:0}}
/*BOXCSS*/
.bxbar{display:flex;gap:8px;align-items:center;margin:0 0 8px}
.bxbtn,.bxsel{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:600 14px system-ui;min-height:40px}
.bxsel{flex:1}
.bxchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.bxchip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 13px system-ui;cursor:pointer}
.bxchip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bxmute{color:var(--mute);font-size:12.5px}.bxpos{color:#16a05a;font-weight:700}.bxneg{color:#d23c46;font-weight:700}.bxwarn{color:#b26a00;font-size:12px;font-weight:700}
.bxnote{background:rgba(240,176,80,.18);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.bxgames{margin:6px 0 8px;line-height:1.7}
.bxnights{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.bxnight{flex:1 1 220px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.bxcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto}
.bxt{width:100%;border-collapse:collapse}
.bxt th,.bxt td{padding:6px 5px;text-align:right;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
.bxt th{color:var(--mute);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
.bxt td:nth-child(2),.bxt th:nth-child(2){text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
.bxt td:first-child,.bxt th:first-child{text-align:left}
.bxt tr[data-i]{cursor:pointer}
.bxt tr.bxme td{background:rgba(43,95,217,.12)}.bxt tr.bxopp td{background:rgba(210,60,70,.12)}
.bxt tr.bxme td:nth-child(2){background:linear-gradient(rgba(43,95,217,.16),rgba(43,95,217,.16)),var(--card)}.bxt tr.bxopp td:nth-child(2){background:linear-gradient(rgba(210,60,70,.16),rgba(210,60,70,.16)),var(--card)}
.bxt tr.bxme td:first-child{box-shadow:inset 4px 0 0 #2b5fd9}.bxt tr.bxopp td:first-child{box-shadow:inset 4px 0 0 #d23c46}
.bxside{display:inline-block;border-radius:5px;padding:0 5px;font-size:10px;font-weight:800;color:#fff;vertical-align:1px}.bxs-me{background:#2b5fd9}.bxs-opp{background:#d23c46}
.bxt .bxoff{opacity:.35;text-decoration:line-through}
.bxdet td{text-align:left !important;white-space:normal !important;font-size:13px;background:rgba(127,127,127,.08)}
.bxreasons{margin:4px 0 0;padding-left:18px}
.bxtag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;background:rgba(127,127,127,.18)}
.bx-PICKUP{background:rgba(22,160,90,.2);color:#16a05a}.bx-WATCH{background:rgba(240,176,80,.22);color:#b26a00}.bx-FLUKE{background:rgba(210,60,70,.18);color:#d23c46}
.bxfoot{margin:10px 2px}
.bxouts{margin-top:6px}.bxout{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 6px;font-size:13px}
.bxout summary{cursor:pointer;font-weight:600}
.bxpill{display:inline-block;background:rgba(127,127,127,.14);border-radius:8px;padding:2px 8px;margin:4px 6px 0 0;font-size:12.5px}
.bxpill.bxme{background:rgba(43,95,217,.2)}.bxpill.bxopp{background:rgba(210,60,70,.18)}

/*ENDBOXCSS*/
</style>
<style id="espn-cats">
/* category chart, ported from the ESPN Lapis page */
:root{--good:#16794a;--good-bg:#e3f4ea;--warn:#8a5a00;--warn-bg:#fff1d0;--bad:#a3262c;--bad-bg:#fbe4e5;--bar:#cfd6e0;--barfill:#2b5fd9}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--good:#6fd29c;--good-bg:#163325;--warn:#f0c15a;--warn-bg:#3a2e12;--bad:#ff8b90;--bad-bg:#3d1c1f;--bar:#323a47;--barfill:#7aa2ff}}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}
.cbar{display:inline-block;width:80px;height:8px;border-radius:4px;background:var(--bar);vertical-align:middle;position:relative;overflow:hidden}
.cbar i{position:absolute;left:0;top:0;bottom:0;background:var(--barfill)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.t-lock,.t-lean{background:var(--good-bg);color:var(--good)}
.t-toss-up{background:var(--warn-bg);color:var(--warn)}
.t-lean-opp,.t-concede{background:var(--bad-bg);color:var(--bad)}
.crow{display:grid;grid-template-columns:62px 1.1fr 1.1fr 150px 86px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.crow.h{font-size:12px;color:var(--mute);font-weight:600;padding-top:0}
.crow:last-child{border-bottom:0}.crow .num{text-align:right}
.crow .c-now{color:var(--mute)}
@media (max-width:700px){
  .crow{grid-template-columns:48px 1fr 112px;gap:2px 8px;padding:9px 0}
  .crow .c-now{grid-column:2;grid-row:2;font-size:12.5px;color:var(--mute);text-align:left}
  .crow.h{display:none}
  .crow .c-call{grid-column:3;grid-row:2;text-align:right;white-space:nowrap}
  .crow .c-bar{grid-column:2;grid-row:1}
  .crow .c-proj{grid-column:3;grid-row:1;text-align:right}
  .crow .c-lab{grid-row:1}
  .cbar{width:100%;display:block;margin-top:6px}
}
.farow{border-bottom:1px solid var(--line);padding:11px 0}.farow:last-child{border-bottom:0}
.farow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.farow .nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mute);margin:3px 0}.farow .nums b{color:var(--ink)}
.farow ul{margin:4px 0 2px;padding-left:18px;font-size:13.5px}.farow .up{font-size:13px;color:var(--warn);font-weight:600;margin-top:3px}
.farow .bx{font-size:12.5px;color:var(--mute);margin-top:3px}
.bo{margin:6px 0 2px;padding:7px 10px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}.bo ul{margin:3px 0 0;padding-left:18px;color:var(--ink)}
.t-MUST,.t-WIN-WIN{background:var(--good-bg);color:var(--good)}.t-STREAM,.t-FAIR{background:rgba(43,95,217,.14);color:var(--acc)}
.t-WATCH,.t-BREAKOUT,.t-ONE-SIDED{background:var(--warn-bg);color:var(--warn)}.t-SKIP{background:var(--line);color:var(--mute)}
.eff{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin:2px 3px 2px 0}.eff.up{background:var(--good-bg);color:var(--good)}.eff.down{background:var(--bad-bg);color:var(--bad)}
.chipbtn{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:700 13px system-ui;color:var(--ink);cursor:pointer;margin:0 6px 6px 0}
.chipbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.srow{border-bottom:1px solid var(--line);padding:10px 0}.srow:last-child{border-bottom:0}.srow .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
</style>

<body>
<header><h1 id="ttl">Julid Daily</h1><div class="sub" id="sub"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
/*BOXJS*/
/* Box score widget shared by the Lapis (ESPN, 13 cats) and Julid (Yahoo, 9 cats) pages. Pasted into both templates by sync_box_widget.py
   (edit THIS file, then run sync_box_widget.py). Needs from the host page: $, esc, and CSS variables --card --line --mute --ink --acc.
   Ideas taken from Basketball Monster's box score page: one row per player line with per-category values, punt toggles that re-value
   and re-rank the night, an owner column, and who did not play. Added here: your matchup's players, luck/next-10/read from our model,
   usage vs usual, and plain-English reasons (including which rotation teammates were out). */
const BXS = {};
function bxMount(root, o) {
  const st = BXS[root.id] = BXS[root.id] || {date: o.def, sort: "value", desc: true, punt: {}, mine: false, fa: false, notable: true, z: false, open: {}};
  if (!o.dates.includes(st.date)) st.date = o.def;
  else if (st.latest && o.def && o.def > st.latest && st.date === st.latest) st.date = o.def;   // a new game day appeared: follow it if you were on the newest
  st.latest = o.def;
  let day = null;
  const tagH = v => o.tag ? o.tag(v) : `<span class="bxtag bx-${esc(v).replace(" ", "")}">${esc(v)}</span>`;
  const pv = p => day.cats.reduce((s, c, i) => s + (st.punt[c] ? 0 : day.weights[i] * (p.z[c] || 0)), 0);
  const punting = () => day && day.cats.some(c => st.punt[c]);
  const f1 = v => (v == null ? "–" : (Math.round(v * 10) / 10).toFixed(1));
  const sg = v => (v > 0 ? "+" : "") + f1(v);
  const zc = v => { const a = Math.min(Math.abs(v) / 2.5, 1); return v >= 0 ? `background:rgba(22,160,90,${(a * .55).toFixed(2)})` : `background:rgba(210,60,70,${(a * .55).toFixed(2)})`; };
  async function load(d) {
    root.querySelector(".bxbody").innerHTML = `<div class="bxnote">reading box scores for ${esc(d)}…</div>`;
    try { day = await o.load(d); st.date = d; render(); } catch (e) { root.querySelector(".bxbody").innerHTML = `<div class="bxnote">${esc(e.message)}</div>`; }
  }
  function rows() {
    let P = day.players.map(p => Object.assign({}, p, {pv: pv(p)}));
    const pun = punting();
    if (pun) { const r = P.slice().sort((a, b) => b.pv - a.pv); r.forEach((p, i) => { p.rank = i + 1; }); }
    const thr = (day.n_cats === 9 ? 3.1 : 4);
    if (st.mine) P = P.filter(p => p.side);
    if (st.fa) P = P.filter(p => !p.owner);
    if (st.notable && !st.mine) P = P.filter(p => !["IGNORE", "NO PRIOR", "NOISE", "ROSTERED"].includes(p.verdict) || p.pv >= thr);
    const get = (p, k) => k.startsWith("z:") ? (p.z || {})[k.slice(2)] : k === "value" ? p.pv : k === "owner" ? (p.owner || "") : p[k];
    const txt = ["name", "team", "verdict", "owner"];
    P.sort((a, b) => { let x = get(a, st.sort), y = get(b, st.sort); if (x == null) x = -1e9; if (y == null) y = -1e9;
      const c = txt.includes(st.sort) ? String(x).localeCompare(String(y)) : x - y; return st.desc ? -c : c; });
    return P;
  }
  function night(side, label) {
    const L = day.players.filter(p => p.side === side);
    if (!L.length) return "";
    const V = L.map(p => [p, pv(p)]).sort((a, b) => b[1] - a[1]);
    const tot = V.reduce((s, x) => s + x[1], 0), best = V[0], worst = V[V.length - 1];
    return `<div class="bxnight"><b>${label}</b> · ${L.length} played · total Value <b class="${tot >= 0 ? "bxpos" : "bxneg"}">${sg(tot)}</b><br>
      <span class="bxmute">best ${esc(best[0].name)} ${sg(best[1])}${V.length > 1 ? ` · worst ${esc(worst[0].name)} ${sg(worst[1])}` : ""}</span></div>`;
  }
  function render() {
    const hasSide = day.players.some(p => p.side);
    const P = rows(), cats = day.cats, lab = day.labels, z = st.z, pun = punting();
    const hdr = [["rank", "#"], ["name", "Player"], ["team", "Tm"], ["min", "Min"], ["pts", "PTS"], ["fg3", "3"], ["reb", "REB"], ["ast", "AST"], ["stl", "STL"], ["blk", "BLK"],
      ["fgm", "FG"], ["ftm", "FT"], ["to", "TO"]].concat(cats.includes("pf") ? [["pf", "PF"]] : [], [["usg", "Usg"], ["value", pun ? "Value*" : "Value"], ["luck", "Luck"], ["proj", "Next 10"], ["verdict", "Read"]]);
    const arrow = k => st.sort === k ? (st.desc ? " ▼" : " ▲") : "";
    const H = hdr.map(([k, l]) => `<th data-k="${k}">${l}${arrow(k)}</th>`).join("") + (z ? cats.map((c, i) => `<th data-k="z:${esc(c)}" class="${st.punt[c] ? "bxoff" : ""}">${esc(lab[i])}${arrow("z:" + c)}</th>`).join("") : "") + `<th data-k="owner">Owner${arrow("owner")}</th>`;
    const B = P.map((p, i) => `<tr data-i="${i}" class="${p.side === "me" ? "bxme" : p.side === "opp" ? "bxopp" : ""}"><td>${p.rank}</td>
      <td>${p.side === "me" ? '<span class="bxside bxs-me">YOU</span> ' : p.side === "opp" ? '<span class="bxside bxs-opp">OPP</span> ' : ""}<b>${esc(p.name)}</b> <span class="bxmute">${esc(p.pos || "")}</span>${p.start ? ' <span class="bxmute">S</span>' : ""}${p.foul ? ' <span class="bxwarn">fouls</span>' : ""}${p.mates_out && p.mates_out.length ? ' <span class="bxwarn" title="rotation teammates out">opening</span>' : ""}${p.fits && p.fits.length ? ` <span class="bxtag bx-WATCH">needs ${esc(p.fits.join(","))}</span>` : ""}</td>
      <td>${esc(p.team)}</td><td>${Math.round(p.min)}</td><td>${p.pts}</td><td>${p.fg3}</td><td>${p.reb}</td><td>${p.ast}</td><td>${p.stl}</td><td>${p.blk}</td><td>${p.fgm}/${p.fga}</td><td>${p.ftm}/${p.fta}</td><td>${p.to}</td>${cats.includes("pf") ? `<td>${p.pf}</td>` : ""}
      <td>${p.usg == null ? "" : Math.round(p.usg) + "%"}</td><td><b>${f1(p.pv)}</b></td><td class="${p.luck > 1.5 * (day.n_cats === 9 ? .77 : 1) ? "bxneg" : p.luck < -1.5 * (day.n_cats === 9 ? .77 : 1) ? "bxpos" : "bxmute"}">${sg(p.luck)}</td><td>${f1(p.proj)}</td><td>${tagH(p.verdict)}</td>
      ${z ? cats.map(c => `<td class="${st.punt[c] ? "bxoff" : ""}" style="${zc(p.z[c])}">${f1(p.z[c])}</td>`).join("") : ""}<td class="bxmute">${p.owner ? esc(p.owner) : (p.own_pct != null ? p.own_pct + "% owned" : "")}</td></tr>`).join("");
    const games = day.games.map(g => `<span>${esc(g.score)}${g.blowout ? ' <span class="bxwarn">blowout</span>' : ""}</span>`).join("  ·  ");
    const outs = day.games.filter(g => g.dnp && g.dnp.length).map(g => `<details class="bxout"><summary>${esc(g.matchup)} · did not play (${g.dnp.length})</summary>${g.dnp.map(x =>
      `<span class="bxpill ${x.side === "me" ? "bxme" : x.side === "opp" ? "bxopp" : ""}">${esc(x.name)}${x.usual_min ? ` <span class="bxmute">${x.usual_min} mpg</span>` : ""}${x.reason ? ` <span class="bxmute">${esc(x.reason.toLowerCase())}</span>` : ""}</span>`).join("")}</details>`).join("");
    root.querySelector(".bxbody").innerHTML = `${day.preseason ? '<div class="bxnote">Preseason game: rotations and minutes are not reliable, so no line is rated above WATCH.</div>' : ""}
      <div class="bxmute bxgames">${games}</div>
      ${hasSide ? `<div class="bxnights">${night("me", "Your players")}${night("opp", "Opponent's players")}</div>` : ""}
      <div class="bxcard"><table class="bxt"><tr>${H}</tr>${B || '<tr><td colspan="30" class="bxmute">Nothing matches the filters.</td></tr>'}</table></div>
      <p class="bxmute bxfoot"><b>Value</b> = the night in your ${day.n_cats} categories (0 = an average draftable player)${pun ? "; <b>*</b> with the punted categories left out and the ranks redone (Luck, Next 10 and Read still use all categories)" : ""}. <b>Luck</b> = part of Value from shots going in above/below his usual rate. <b>Usg</b> = share of his team's possessions he used. <b>Next 10</b> = expected Value over his next ten games. <b>opening</b> = a rotation teammate (18+ usual minutes) sat out. Tap a row for the reasons.</p>
      <div class="bxouts">${outs}</div>`;
    root.querySelectorAll(".bxt th").forEach(th => th.onclick = () => { const k = th.dataset.k; if (st.sort === k) st.desc = !st.desc; else { st.sort = k; st.desc = !["rank", "name", "team", "owner", "verdict"].includes(k); } render(); });
    root.querySelectorAll(".bxt tr[data-i]").forEach(tr => tr.onclick = () => {

const TABS = [["m","Matchup","🏀"],["l","Lineup","📝"],["b","Box","📋"],["s","Moves","🔄"],["f","FA","🆓"],["r","Rater","⭐"],["o","Rosters","👥"],["g","League","📊"],["y","Season","🗓"],["i","Info","ℹ️"]];
let FA_TIER = "all", FA_Q = "";
let tab = "m", dayIdx = null;
try { tab = localStorage.getItem("jd_tab") || "m"; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => Math.round(v * 100) + "%";
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const tagc = t => "t-" + t.replace(" ", "-");
const isPct = k => k === "fg_pct" || k === "ft_pct";

function nav() {
  $("#nav").innerHTML = TABS.map(([k, n, ic]) => `<button class="${k === tab ? "on" : ""}" data-k="${k}"><i>${ic}</i>${n}</button>`).join("");
  $("#nav").onclick = e => { const bt = e.target.closest("button"), k = bt && bt.dataset.k; if (k) { tab = k; try { localStorage.setItem("jd_tab", k); } catch (x) {} draw(); window.scrollTo(0, 0); } };
}

function routineCard(S){
  const cs = S.cats || [];
  const swing = cs.filter(c => c.p > .35 && c.p < .65).map(c => esc(c.label)).join(", ");
  const lost = cs.filter(c => c.p <= .35).map(c => esc(c.label)).join(", ");
  const won = cs.filter(c => c.p >= .65).map(c => esc(c.label)).join(", ");
  const b = S.budget;
  return `<details class="card"><summary><b>How to win this week (routine)</b></summary>
    <p class="small mute" style="margin:8px 0">A week is won by taking at least 5 of 9 categories. Put adds and attention on the swing categories; locks and lost causes are wasted effort.</p>
    <p class="small" style="margin:6px 0"><b>Swing now:</b> ${swing || "none"}<br><b>Probably won:</b> ${won || "none"}<br><b>Probably lost:</b> ${lost || "none"}${b ? `<br><b>Acquisitions:</b> ${b.left} left, about ${b.per_week.toFixed(1)} per week to the end` : ""}</p>
    <ul class="small" style="margin:6px 0;padding-left:20px">
      <li><b>Mon/Tue:</b> read the category table, then the Streaming tab.</li>
      <li><b>Every morning:</b> refresh the Yahoo data first (Info &rarr; Refresh), then set the lineup before tip-off.</li>
      <li><b>Before late games:</b> re-check scratches and injuries.</li>
      <li><b>Adds:</b> only worth it on a day when you start fewer players than slots. Spread the acquisitions across the season.</li>
      <li><b>Trades:</b> use the trade finder for a category you lose every week.</li>
    </ul>
    <p class="small mute" style="margin:6px 0">Streaming moves the win chance by a few points, not tens. Roster quality and trades matter more.</p></details>`;
}

function histCard(H){
  if(!H||!H.length)return '';
  const kindName={you:'your moves',opp:"opponent's moves",inj:'injuries',games:'games played',model:'projection refresh'};
  const sg=v=>(v>=0?'+':'')+(v*100).toFixed(1);
  return `<details class="card"><summary><b>Week log: what moved the forecast</b></summary><p class="small mute" style="margin:8px 0">Every week is kept. Each line is a refresh where something changed, with the cause found by comparing it to the refresh before. Points are win-chance points.</p>`+H.map(w=>{
    const kinds=Object.entries(w.by_kind||{}).filter(([k,v])=>Math.abs(v)>=0.005).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k,v])=>`${kindName[k]||k} ${sg(v)}`).join(' · ');
    return `<details ${w.current?'open':''} style="margin:8px 0"><summary><b>Week ${w.week}</b> vs ${esc(w.opp)}: <b>${(w.first.p_win*100).toFixed(0)}% → ${(w.last.p_win*100).toFixed(0)}%</b> <span class="mute" style="font-size:12px">(${w.first.exp.toFixed(1)} → ${w.last.exp.toFixed(1)} exp cats)</span></summary>
      ${kinds?`<div class="mute" style="font-size:12.5px;margin:4px 0">Net by cause: ${kinds}</div>`:''}
      ${w.events.length?w.events.map(e=>`<div style="font-size:13px;margin:5px 0;padding-left:8px;border-left:3px solid var(--line)"><span class="mute">${esc(e.ts.slice(5))}</span> <b>${(e.p_win*100).toFixed(0)}%</b> <span class="${e.d_pwin>=0?'good':'bad'}">${sg(e.d_pwin)}</span>${e.movers.length?' <span class="mute">('+e.movers.map(m=>esc(m.cat)+' '+(m.dp>=0?'+':'')+(m.dp*100).toFixed(0)+'%').join(', ')+')</span>':''}<br>${e.causes.map(esc).join('<br>')}</div>`).join(''):'<div class="mute" style="font-size:13px">No changes logged yet.</div>'}
    </details>`}).join('')+`</details>`;
}

function swingCard(S){
  const w=S.swing;if(!w)return '';
  const r=w.rel,fav=w.side==='under',cl=x=>Math.min(99,Math.max(1,Math.round(x*100)))+'%';
  return `<details class="card"><summary>How far can this number move? <span class="mute" style="font-size:12px">${cl(w.lo)} to ${cl(w.hi)} by ${esc(w.label)}</span></summary>
    <p class="sub" style="margin:8px 0">Today <b>${pct(w.p_now)}</b>. By the end of <b>${esc(w.label)}</b> it will most likely sit between <b>${cl(w.lo)}</b> and <b>${cl(w.hi)}</b> (8 weeks in 10). Chance it ${fav?'falls under':'climbs over'} 50% by then: <b>${pct(w.p_under)}</b>. About ${pct(w.f)} of the week's remaining player-games are played by then.</p>
    <p class="sub" style="margin:0">Is the number honest? Over ${r.total.toLocaleString()} past weeks, pre-week forecasts in the ${r.band} band won <b>${pct(r.won)}</b> of the time (the tool said ${pct(r.said)}; ${r.n} weeks in that band). So a big swing is normal variance, not a broken forecast. This range assumes the games alone move it; injuries and streaming moves add more.</p></details>`;
}

function matchup(S) {
  const win = S.p_win;
  const ageH = S.yahoo_ts ? (Date.now() - Date.parse(S.yahoo_ts)) / 36e5 : null;
  let h = (ageH !== null && ageH > 6 ? `<div class="note"><b>Stale data.</b> Yahoo rosters were last read ${Math.round(ageH)} hours ago: recent adds, drops and lineup changes may be missing. See Info &rarr; Refresh the data.</div>` : "") + `<div class="card"><div class="row"><div><div class="mute small">Week ${S.week} · ${esc(S.start)} to ${esc(S.end)}</div><div style="font-weight:600">${esc(S.me)} vs ${esc(S.opp)}</div></div>
    <div style="text-align:right"><div class="big ${win >= .5 ? "good" : "bad"}">${pct(win)}</div><div class="mute small">chance to win</div></div></div>
    <div class="bar" style="margin:10px 0 6px"><i style="width:${S.exp_cats / 9 * 100}%"></i></div>
    <div class="small mute">Expect about <b>${S.exp_cats.toFixed(1)}</b> of 9 categories (need 5). Calls use the best lineup every day and a category plan tuned against this opponent.</div></div>`;
  h += swingCard(S);
  const mar = c => { const d = c.me - c.opp; const u = isPct(c.key) ? (d * 100).toFixed(1) + " pts" : f1(d); return `Margin ${d >= 0 ? "+" : ""}${u}${c.key === "to" ? " (lower wins)" : ""}`; };
  h += `<div class="card"><h2>Categories</h2><div class="crow h"><div>Cat</div><div class="num">Final: you v opp</div><div>Win chance</div><div>Margin</div><div>Call</div></div>` +
    S.cats.map(c => { const lead = c.key === "to" ? c.me < c.opp : c.me > c.opp;
      return `<div class="crow"><div class="c-lab"><b>${esc(c.label)}</b>${c.weight < 0.99 ? `<span class="muted small"> ${c.weight === 0 ? "punt" : "light"}</span>` : ""}</div>
      <div class="c-proj num"><span class="${lead ? "pos" : "neg"}">${val(c, c.me)}</span> <span class="mute">v ${val(c, c.opp)}</span></div>
      <div class="c-bar"><span class="cbar"><i style="width:${pct(c.p)}"></i></span></div>
      <div class="c-now">${c.me_now != null ? `So far ${val(c, c.me_now)} v ${val(c, c.opp_now)} · ` : ""}${mar(c)}</div>
      <div class="c-call"><b>${pct(c.p)}</b> <span class="tag ${tagc(c.tag)}">${esc(c.tag)}</span></div></div>`; }).join("") + `</div>`;
  const tight = S.cats.filter(c => c.p > .35 && c.p < .65).map(c => c.label);
  const lose = S.cats.filter(c => c.p <= .35).map(c => c.label);
  h += `<div class="card"><h2>Read-out</h2><div class="small">${tight.length ? `<b>Swing categories:</b> ${tight.join(", ")}. ` : ""}${lose.length ? `<b>Probably lost:</b> ${lose.join(", ")}.` : "No category looks lost."}</div></div>`;
  if (S.path && S.path.length) h += `<div class="card"><h2>Cumulative standing by day <span class="mute small">(before → after)</span></h2>
    <div class="small mute" style="margin-bottom:8px">Expected categories you are ahead in (of 9), before and after each day's games: what Yahoo already has plus the planned lineup, chance-weighted. A side that has played fewer games looks "ahead" in TO for free, so check the games.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">` + S.path.map(p => `<div style="flex:1 1 150px;background:var(--chip);border-radius:10px;padding:8px 10px" title="${esc(p.lead_cats.join(", "))}"><b class="mute small">${esc(p.label)}</b><br><span class="mute">${p.before_exp.toFixed(1)} → </span><b style="font-size:20px">${p.exp.toFixed(1)}</b> <span class="mute small">/9 cats</span>
      <div class="mute small">games from now: you ${p.gp_me.toFixed(0)} · opp ${p.gp_op.toFixed(0)}</div><div class="mute small">ahead: ${esc(p.lead_cats.join(", ") || "none")}</div></div>`).join("") + `</div></div>`;
  h += oppCard(S); h += routineCard(S);
  h += histCard(S.history);
  h += `<div class="card"><h2>Their roster this week</h2>` + S.opp_roster.map(p => `<span class="pill">${esc(p.name)} · ${p.games}g${p.inj !== "ACTIVE" ? ` <span class="inj">${p.inj === "OUT" ? "OUT" : "Q"}</span>` : ""}</span>`).join("") + `</div>`;
  return h;
}

const pc = v => (v == null ? "–" : v.toFixed(3).replace(/^0/, ""));
function lineup(S) {
  if (dayIdx === null) dayIdx = Math.max(0, S.lineup.findIndex(d => !d.past));
  const d = S.lineup[dayIdx];
  let h = `<div class="dayrow">` + S.lineup.map((x, i) => `<button class="${i === dayIdx ? "on" : ""}" data-d="${i}">${esc(x.day)}</button>`).join("") + `</div>`;
  h += `<div class="card"><h2>${esc(d.day)} — ${d.starters.length} starters</h2>` +

  const pp = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(1);
  const ce = l => l.map(c => `<span class="eff ${c.dz > 0 ? "up" : "down"}">${esc(c.cat)} ${c.dz > 0 ? "▲" : "▼"}</span>`).join("");
  const row = r => `<div class="srow"><div class="top"><span><span class="tag t-${esc(r.verdict)}">${esc(r.verdict)}</span> <span class="mute">${esc(r.kind)}</span></span><span>you <b class="${r.d_me >= 0 ? "pos" : "neg"}">${pp(r.d_me)}</b> · them <b class="${r.d_them >= 0 ? "pos" : "neg"}">${pp(r.d_them)}</b></span></div>
    <div style="margin:3px 0"><span class="mute">You give</span> <b>${esc(r.give.join(" + "))}</b> <span class="mute">· you get</span> <b>${esc(r.get.join(" + "))}</b></div>
    <div class="mute small">Your power ${pct(r.me_from)} → ${pct(r.me_to)} · theirs ${pct(r.them_from)} → ${pct(r.them_to)}${r.fill_me.length ? " · you then add " + esc(r.fill_me.join(", ")) : ""}${r.drop_me.length ? " · you then drop " + esc(r.drop_me.join(", ")) : ""}${r.drop_them.length ? " · they must drop " + esc(r.drop_them.join(", ")) : ""}</div>
    <div><span class="mute small">You:</span> ${ce(r.me_cats) || '<span class="mute small">no big change</span>'} <span class="mute small">They:</span> ${ce(r.them_cats) || '<span class="mute small">none</span>'}</div></div>`;
  return `<div class="card"><h2>Trade with one team</h2><div style="margin-bottom:6px"><label>Partner <select id="tpsel">${opts}</select></label></div>
    <div class="mute small" style="margin-bottom:6px">Only trades with this team, searched deeper than the main finder (ten screened, all checked in full) and with a looser limit on what they give up, so ONE-SIDED deals show too. Same scoring as above: numbers are points of power over weeks ${esc(T.weeks.join(", "))}.</div>
    ${rows.length ? rows.map(row).join("") : '<div class="mute">No trade with this team raises your power in the model.</div>'}</div>`;
}

function rater(S) {
  const R = S.rater; if (!R) return `<div class="card mute">Player rater unavailable: Yahoo ranks are not in the data yet (run the refresh once).</div>`;
  const cget = (r, k) => /^c\d+$/.test(k) ? (r.our && r.our[+k.slice(1)]) : (k === "name" || k === "owner") ? (r[k] || "") : r[k];
  let P = R.rows.filter(r => (!RT.q || r.name.toLowerCase().includes(RT.q.toLowerCase())) && (RT.own === "all" || (RT.own === "fa" && !r.owner) || (RT.own === "mine" && r.owner === S.me) || (RT.own === "ros" && r.owner)));
  P = sortBy(P, cget, RT.k, RT.d);
  const st = {k: RT.k, d: RT.d};
  const hdr = [["yahoo_rank", "Y#"], ["our_rank", "O#"], ["d_rank", "Δ"], ["name", "Player"], ["owner", "Owner"], ["our_tot", "Our total"]]
    .map(([k, l]) => `<th class="s" data-tbl="rt" data-k="${k}" ${k === "name" || k === "owner" ? 'style="text-align:left"' : ""}>${l}${arrow(st, k)}</th>`).join("") + R.cats.map((c, i) => `<th class="s" data-tbl="rt" data-k="c${i}">${esc(c)}${arrow(st, "c" + i)}</th>`).join("");
  const body = P.map(r => `<tr class="${r.owner === S.me ? "me" : ""}"><td>${r.yahoo_rank}</td><td><b>${r.our_rank || "–"}</b></td><td class="${r.d_rank > 0 ? "good" : r.d_rank < 0 ? "bad" : "mute"}"><b>${r.d_rank == null ? "–" : (r.d_rank > 0 ? "+" : "") + r.d_rank}</b></td>
    <td style="text-align:left;white-space:nowrap"><b>${esc(r.name)}</b>${r.inj && r.inj !== "ACTIVE" ? ` <span class="inj">${r.inj === "OUT" ? "OUT" : "Q"}</span>` : ""}</td><td class="mute" style="text-align:left;white-space:nowrap">${r.owner ? esc(r.owner) : "FA"}</td>
    <td><b>${r.our_tot == null ? '<span class="mute">n/a</span>' : r.our_tot.toFixed(1)}</b></td>${R.cats.map((_, i) => zcell(r.our && r.our[i])).join("")}</tr>`).join("");
  const mk = (id, v, l) => `<option value="${v}" ${RT[id] === v ? "selected" : ""}>${l}</option>`;
  return `<div class="card"><h2>Player rater: Yahoo rank vs our rank</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px"><input type="text" id="rtq" placeholder="Search player" value="${esc(RT.q)}" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit">
      <label>Show <select id="rtown">${mk("own", "all", "everyone")}${mk("own", "fa", "free agents")}${mk("own", "ros", "rostered")}${mk("own", "mine", "my team")}</select></label></div>
    <div class="scroll" style="max-height:72vh;overflow:auto"><table id="rtt"><tr>${hdr}</tr>${body || '<tr><td colspan="30" class="mute">No players match.</td></tr>'}</table></div>
    <div class="mute small" style="margin-top:8px">Tap any heading to sort (tap again to reverse). <b>Y# = Yahoo rank</b> (1 = best) = <b>${esc(R.label)}</b>, read from your league's Players page${R.ts ? " on " + esc(R.ts.slice(0, 16).replace("T", " ")) + " UTC" : ""}; it switches to Yahoo's live rank by itself once the season starts. <b>O# = our rank</b> (1 = best) = our model's total over your 9 categories among the ${R.n_ours} ranked players we can project. <b>Δ = rank gap</b> = Yahoo rank − our rank: positive means we rank him higher than Yahoo, negative lower. The category columns and total are only ours (0 = average draftable player; high TO counts negative). The two rankings agree at ρ = ${R.rank_corr == null ? "?" : R.rank_corr.toFixed(2)}. Yahoo ranks the top ${R.n_ranked} players only. Big gaps are often injuries or role changes: questions to check, not verdicts.</div></div>`;
}

function rosters(S) {
  const RO = S.rosters; if (!RO) return `<div class="card mute">Roster analysis unavailable: Yahoo ranks are not in the data yet (run the refresh once).</div>`;
  const ids = Object.keys(RO); if (!RS.team || !RO[RS.team]) RS.team = String(Object.keys(S.teams).find(id => S.teams[id].name === S.me) || ids[0]);
  const pl = RO[RS.team], tm = S.power.find(t => String(t.id) === RS.team);
  const cget = (r, k) => k.startsWith("g:") ? (r.pg && r.pg[k.slice(2)]) : k === "name" || k === "inj" ? (r[k] || "") : k === "pos" ? (r.elig || []).join("/") : r[k];
  const P = sortBy(pl, cget, RS.k, RS.d), st = {k: RS.k, d: RS.d};
  const opts = S.power.slice().sort((a, b) => a.team.localeCompare(b.team)).map(t => `<option value="${t.id}" ${String(t.id) === RS.team ? "selected" : ""}>${esc(t.team)}${t.team === S.me ? " (you)" : ""}</option>`).join("");
  const th = (k, l, cls, extra) => `<th class="s ${cls || ""}" data-tbl="rs" data-k="${k}" ${extra || ""}>${l}${arrow(st, k)}</th>`;
  const hdr = th("name", "Player", "stk", 'style="text-align:left"') + th("pos", "Pos", "", 'style="text-align:left"') + th("inj", "Status") + th("our_rank", "O#") + th("yahoo_rank", "Y#") + PGK.map(([k, l]) => th("g:" + k, l)).join("");
  const fmtp = (k, v) => v == null ? "–" : k.endsWith("pct") ? v.toFixed(3).replace(/^0/, "") : v.toFixed(1);
  const rows = P.map(r => `<tr><td class="stk" style="text-align:left;white-space:nowrap"><span class="pname" title="${esc(r.name)}"><b>${esc(r.name)}</b></span></td><td style="text-align:left">${esc((r.elig || []).join("/"))}</td>
    <td>${r.inj && r.inj !== "ACTIVE" ? `<span class="inj">${r.inj === "OUT" ? "OUT" : "Q"}</span>` : ""}</td><td><b>${r.our_rank || "–"}</b></td><td>${r.yahoo_rank || "–"}</td>${PGK.map(([k]) => `<td>${fmtp(k, r.pg && r.pg[k])}</td>`).join("")}</tr>`).join("");
  const comp = {}; pl.forEach(r => (r.elig || []).forEach(p => comp[p] = (comp[p] || 0) + 1));
  const compTxt = ["PG", "SG", "SF", "PF", "C"].map(p => `${p} ${comp[p] || 0}`).join(" · ");
  document.body.classList.toggle("rost-full", RS.full);
  const strong = tm ? PGK.map(([k, l]) => [l, tm.cat_p[l]]).filter(x => x[1] >= 0.62).map(x => x[0]).join(" ") : "";
  const weak = tm ? PGK.map(([k, l]) => [l, tm.cat_p[l]]).filter(x => x[1] <= 0.38).map(x => x[0]).join(" ") : "";
  return `<div class="card"><div class="row"><h2 style="margin:0">Roster analysis</h2><span class="noprint"><button class="pbtn" id="rsfull">${RS.full ? "Short names" : "Full names"}</button> <button class="pbtn" id="rspdf">Export PDF</button></span></div>
    <div class="noprint" style="margin:8px 0"><label>Team <select id="rssel">${opts}</select></label></div>
    <div class="mute small" style="margin-bottom:8px"><b>${tm ? esc(tm.team) : ""}</b> · ${esc(S.asof)} · ${tm ? "expected " + tm.exp_cats_vs_avg.toFixed(2) + " cats vs an average team this week · " : ""}${pl.length} players · positions covered (each player counts at every position he is eligible at): ${compTxt}<br>
      <span class="good">Strong: ${esc(strong || "none")}</span> &nbsp; <span class="bad">Weak: ${esc(weak || "none")}</span></div>
    <div class="scroll"><table id="rst"><tr>${hdr}</tr>${rows}</table></div>
    <div class="mute small" style="margin-top:8px">The player column stays in place when you scroll sideways; <b>Full names</b> widens it. <b>O# = our rank</b> = rank in our model among the players we can project (1 = best); <b>Y# = Yahoo rank</b> = ${esc(S.rater ? S.rater.label : "Yahoo's rank")} (1 = best; blank = outside Yahoo's top ${S.rater ? S.rater.n_ranked : ""}). The 9 category columns are your league's categories as our per-game projection (preseason model blended with real games). Tap a heading to sort. <b>Export PDF</b> opens the print dialog: choose "Save as PDF" (on a phone: Share, then Print).</div></div>`;
}

function oppCard(S){
  const ow=S.opp_watch,P=ow&&ow.pattern;
  if(!ow)return '';
  const f=(v,g)=>v==null?'-':g(v);
  const dn=i=>String((S.days||[])[i]||'day '+i).split(' ')[0];
  let body;
  if(!P){body='<div class="small mute">No habit profile for this opponent yet (too few moves logged): a flat 50% chance that he streams is assumed.</div>';}
  else{
    const pr=P.profile,H=ow.habits;
    const bars=Object.keys(P.day_adds).map(i=>`<span class="chipbtn" style="cursor:default">${esc(dn(+i))} <b>${P.day_adds[i].toFixed(1)}</b></span>`).join('');
    body=`<div class="small" style="margin:0 0 6px"><b>How ${esc(S.opp)} streams</b> (from ${pr.n_adds} logged adds over ${pr.weeks_seen} finished week${pr.weeks_seen===1?'':'s'}; data <b>${esc(pr.conf)}</b>)</div>
    <div class="small" style="margin:0 0 6px">Typically <b>${(pr.adds_per_week_frac*10).toFixed(1)}</b> adds a week · still to come this week <b>${P.lam_rem.toFixed(1)}</b> · chance of another add <b>${pct(P.p_any)}</b> · next add likely <b>${esc(dn(P.next_idx))}</b><br>
    Pick-ups held <b>${f(pr.hold_median,v=>v.toFixed(1)+' d')}</b> (median) · quick streamers <b>${f(pr.streamer_share,pct)}</b></div>
    <div class="small mute" style="margin:0 0 4px">Expected adds per day left:</div><div>${bars}</div>
    <div class="small mute" style="margin:6px 0 0">${H&&H.league.dow_habit?'Weekday habits are team-specific.':'No reliable weekday habit yet, so the league-wide weekday pattern is used; the team-specific part is how many adds he makes and how long he holds them.'} Win chance above = mix of "opponent idle" (${pct(S.p_win_static)}) and "opponent streams" (${S.p_win_stream==null?'n/a':pct(S.p_win_stream)}) weighted by the chance he streams (${pct(ow.propensity)}).</div>`;
    if(ow.moves&&ow.moves.length)body+='<div class="small" style="margin:6px 0 0">His best swaps if he acts: '+ow.moves.map(m=>`<b>+${esc(m.add)}</b> for ${esc(m.drop)} (+${(m.d_pwin*100).toFixed(1)} pts for him)`).join('; ')+'</div>';
  }
  return `<details class="card"><summary><b>Opponent watch: streaming habits</b></summary><div style="margin-top:8px">${body}</div></details>`;
}

function habitsCard(S){
  const H=S.opp_watch&&S.opp_watch.habits;
  if(!H||!H.rows.length)return '';
  const rows=H.rows.map(r=>`<tr><td><b>${esc(r.name)}</b>${r.is_me?' <span class="tag t-lean">YOU</span>':''}</td><td>${(r.adds_per_week_frac*10).toFixed(1)}</td><td>${r.n_adds}</td><td>${r.streamer_share==null?'-':pct(r.streamer_share)}</td><td>${r.hold_median==null?'-':r.hold_median.toFixed(1)+' d'}</td><td>${esc(r.conf)}</td></tr>`).join('');
  const L=H.league;
  return `<div class="card"><h2>Streaming habits of every team</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse" class="small"><tr><th align="left">Team</th><th>Adds / wk</th><th>Adds seen</th><th>Quick</th><th>Held</th><th>Data</th></tr>${rows}</table></div>
   <div class="small mute" style="margin-top:8px">Built from the move log (rosters compared on each refresh, so only moves seen between refreshes count). Adds / week is shrunk toward the league mean (${pct(L.mean_frac)}) until more weeks are seen; "Quick" = pick-ups dropped again within 3.5 days. League weekday pattern from ${L.n_adds} adds: ${H.days.map((d,i)=>d+' '+pct(L.dow[i])).join(', ')}.</div></div>`;
}

function moveLog(S) {
  const L = S.moves_log || [];
  return habitsCard(S) + `<div class="card"><h2>Roster movements</h2>` + (L.length ? L.map(m => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(m.team)}</b> <span class="tag ${m.kind === "TRADE" ? "t-lean" : "t-toss-up"}">${m.kind}${m.partner ? " with " + esc(m.partner) : ""}</span> <span class="mute small">${esc(String(m.ts).slice(0, 16).replace("T", " "))} UTC</span><br>
    ${m.in.length ? '<span class="good">+ ' + esc(m.in.join(", ")) + "</span> " : ""}${m.out.length ? '<span class="bad">− ' + esc(m.out.join(", ")) + "</span>" : ""}</div>`).join("") : `<div class="mute">No moves seen yet. Each refresh compares every roster with the previous one (by Yahoo player id, so players without a projection are included) and lists every add, drop and trade here.</div>`) + `</div>`;
}

function wire() {
  const on = (id, ev, fn) => { const e = document.getElementById(id); if (e) e[ev] = fn; };
  on("tpsel", "onchange", e => { TP = e.target.value; draw(); });
  on("rtown", "onchange", e => { RT.own = e.target.value; draw(); });
  on("rtq", "oninput", e => { RT.q = e.target.value; const p = e.target.selectionStart; draw(); const n = document.getElementById("rtq"); n.focus(); n.setSelectionRange(p, p); });
  on("rssel", "onchange", e => { RS.team = e.target.value; draw(); });
  on("rsfull", "onclick", () => { RS.full = !RS.full; draw(); });
  on("rspdf", "onclick", () => { window.print(); });
  document.querySelectorAll("th.s[data-tbl]").forEach(h => h.onclick = () => {
    const rt = h.dataset.tbl === "rt", st = rt ? RT : RS, k = h.dataset.k;
    if (st.k === k) st.d = !st.d; else { st.k = k; st.d = !["yahoo_rank", "our_rank", "name", "owner", "pos", "inj"].includes(k); }
    draw();
  });
}

function box(S) {
  const B = S.box;
  if (!B || !B.dates || !B.dates.length) return `<div class="card">No finished NBA game day in the last week yet. Box scores appear here after the first games.</div>`;
  return `<div id="bxroot"></div>`;
}
function mountBox() {
  const B = STATE.box, el = document.getElementById("bxroot");
  if (!el || !B) return;
  bxMount(el, {dates: B.dates.slice().reverse(), def: B.def, status: B.status, cats: B.cats, labels: B.labels, load: async d => B.days[d]});
}
function draw() {
  const S = STATE;
  nav();
  if (!S) { $("#main").innerHTML = `<div class="card">No data embedded.</div>`; return; }
  $("#ttl").textContent = S.me;
  $("#sub").textContent = `Julid NBA League · Week ${S.week} vs ${S.opp} · data ${S.asof}`;
  $("#main").innerHTML = {m: matchup, l: lineup, b: box, s: moves, f: fa, r: rater, o: rosters, g: league, y: season, i: info}[tab](S);
  wire();
  if (tab === "b") mountBox();
  document.querySelectorAll("[data-fat]").forEach(b => b.onclick = () => { FA_TIER = b.dataset.fat; draw(); });
  const inp = document.getElementById("faq");
  if (inp) inp.oninput = () => { FA_Q = inp.value; const p = inp.selectionStart; draw(); const n = document.getElementById("faq"); n.focus(); n.setSelectionRange(p, p); };
  const cb = document.getElementById("cpbm");
  if (cb) cb.onclick = async () => { try { await navigator.clipboard.writeText(S.bookmarklet); cb.textContent = "Copied"; } catch (e) { prompt("Copy this code:", S.bookmarklet); } };
  document.querySelectorAll(".dayrow button").forEach(b => b.onclick = () => { dayIdx = +b.dataset.d; draw(); });
}
draw();
async function pollBox() {       // box.json is rewritten by every cloud rebuild; picking it up here means no manual reload for new games or a new day
  try {
    const r = await fetch("box.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.built || (STATE.box && STATE.box.built === j.built)) return;
    STATE.box = j;
    if (tab === "b") draw();
  } catch (e) {}
}
setInterval(pollBox, 120000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollBox(); });
pollBox();
</script>
</body>
</html>
